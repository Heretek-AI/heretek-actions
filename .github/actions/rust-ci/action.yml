name: "Rust CI"
description: |
  Composite action for Rust projects: toolchain setup, caching, formatting,
  linting (clippy), testing, optional coverage (llvm-cov), and optional
  security audit. Outputs .agent/output.json.

author: "Heretek-AI"

inputs:
  working-directory:
    description: "Directory containing Cargo.toml"
    default: "."
    required: false
  toolchain:
    description: "Rust toolchain (stable, nightly, or explicit version)"
    default: "stable"
    required: false
  components:
    description: "Additional Rust components to install"
    default: "clippy, rustfmt"
    required: false
  cache-workspaces:
    description: "Comma-separated workspace directories to cache"
    default: ""
    required: false
  system-dependencies:
    description: "Shell command to install system dependencies"
    default: ""
    required: false
  lint-command:
    description: "Override lint command (default: cargo clippy -- -D warnings)"
    default: ""
    required: false
  test-command:
    description: "Override test command (default: cargo test)"
    default: ""
    required: false
  test-continue-on-error:
    description: "Continue if tests fail"
    default: "false"
    required: false
  lint-continue-on-error:
    description: "Continue if lint fails"
    default: "false"
    required: false
  enable-coverage:
    description: "Enable code coverage via cargo-llvm-cov"
    default: "false"
    required: false
  coverage-path:
    description: "Path to coverage output for upload"
    default: "coverage/lcov.info"
    required: false
  enable-audit:
    description: "Enable cargo-audit security audit"
    default: "false"
    required: false

outputs:
  agent_action:
    description: "Always 'ci-rust'"
    value: "ci-rust"
  status:
    description: "success | failure | partial"
    value: ${{ steps.envelope.outputs.status }}
  summary:
    description: "CI summary"
    value: ${{ steps.envelope.outputs.summary }}

runs:
  using: "composite"
  steps:
    - name: "Setup Rust Toolchain"
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: "Setup Rust Cache"
      uses: swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.cache-workspaces }}

    - name: "Install System Dependencies"
      if: inputs.system-dependencies != ''
      shell: bash
      run: ${{ inputs.system-dependencies }}

    - name: "Cargo Format"
      id: fmt
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        cargo fmt --check 2>&1 | tee .fmt-output.txt
        echo "exit_code=$?" >> $GITHUB_OUTPUT

    - name: "Cargo Clippy"
      id: clippy
      continue-on-error: ${{ inputs.lint-continue-on-error == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        CMD="${{ inputs.lint-command }}"
        if [ -z "$CMD" ]; then
          CMD="cargo clippy -- -D warnings"
        fi
        eval "$CMD" 2>&1 | tee .clippy-output.txt
        echo "exit_code=$?" >> $GITHUB_OUTPUT

    - name: "Cargo Test"
      id: test
      continue-on-error: ${{ inputs.test-continue-on-error == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        CMD="${{ inputs.test-command }}"
        if [ -z "$CMD" ]; then
          CMD="cargo test"
        fi
        eval "$CMD" 2>&1 | tee .test-output.txt
        echo "exit_code=$?" >> $GITHUB_OUTPUT

    - name: "Cargo Audit"
      id: audit
      if: inputs.enable-audit == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        cargo audit 2>&1 | tee .audit-output.txt
        echo "exit_code=$?" >> $GITHUB_OUTPUT

    - name: "Code Coverage"
      id: coverage
      if: inputs.enable-coverage == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        cargo install cargo-llvm-cov 2>/dev/null || true
        cargo llvm-cov --all-features --lcov --output-path ${{ inputs.coverage-path }} 2>&1 | tee .cov-output.txt
        echo "exit_code=$?" >> $GITHUB_OUTPUT

    - name: "Generate Agent Envelope"
      id: envelope
      shell: bash
      env:
        FMT_EXIT: ${{ steps.fmt.outputs.exit_code }}
        CLIPPY_EXIT: ${{ steps.clippy.outputs.exit_code }}
        TEST_EXIT: ${{ steps.test.outputs.exit_code }}
        AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
        COV_EXIT: ${{ steps.coverage.outputs.exit_code }}
      run: |
        ${{ github.action_path }}/write-envelope.sh
