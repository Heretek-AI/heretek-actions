name: "JavaScript/TypeScript CI"
description: |
  Composite action for JS/TS projects: setup Node, cache, install deps,
  lint, typecheck, and test. Supports npm, pnpm, yarn, and bun.
  Outputs .agent/output.json.

author: "Heretek-AI"

inputs:
  working-directory:
    description: "Working directory"
    default: "."
    required: false
  package-manager:
    description: "Package manager: npm, pnpm, yarn, bun, or auto (default)"
    default: "auto"
    required: false
  node-version:
    description: "Node.js version"
    default: "20"
    required: false
  lint-command:
    description: "Override lint command"
    default: ""
    required: false
  typecheck-command:
    description: "Override typecheck command"
    default: ""
    required: false
  test-command:
    description: "Override test command"
    default: ""
    required: false
  lint-continue-on-error:
    description: "Continue if lint fails"
    default: "false"
    required: false
  test-continue-on-error:
    description: "Continue if tests fail"
    default: "false"
    required: false

outputs:
  agent_action:
    description: "Always 'ci-js'"
    value: "ci-js"
  status:
    description: "success | failure | partial"
    value: ${{ steps.envelope.outputs.status }}
  summary:
    description: "CI summary"
    value: ${{ steps.envelope.outputs.summary }}

runs:
  using: "composite"
  steps:
    - name: "Detect Package Manager"
      id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        PM="${{ inputs.package-manager }}"
        if [ "$PM" = "auto" ]; then
          if [ -f "pnpm-lock.yaml" ]; then PM="pnpm"
          elif [ -f "yarn.lock" ]; then PM="yarn"
          elif [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then PM="bun"
          else PM="npm"
          fi
        fi
        echo "pm=${PM}" >> "$GITHUB_OUTPUT"
        echo "manager: ${PM}"

    - name: "Setup Node.js"
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: "Setup pnpm"
      if: steps.detect.outputs.pm == 'pnpm'
      uses: pnpm/action-setup@v4
      with:
        version: latest

    - name: "Setup Bun"
      if: steps.detect.outputs.pm == 'bun'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: "Cache Dependencies"
      uses: actions/cache@v4
      with:
        path: |
          ${{ inputs.working-directory }}/node_modules
          ${{ inputs.working-directory }}/.pnpm-store
        key: ${{ runner.os }}-${{ steps.detect.outputs.pm }}-${{ hashFiles(format('{0}/{1}', inputs.working-directory, steps.detect.outputs.pm == 'pnpm' && 'pnpm-lock.yaml' || steps.detect.outputs.pm == 'yarn' && 'yarn.lock' || steps.detect.outputs.pm == 'bun' && 'bun.lock' || 'package-lock.json')) }}

    - name: "Install Dependencies"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        case "${{ steps.detect.outputs.pm }}" in
          pnpm) pnpm install --frozen-lockfile ;;
          yarn) yarn install --frozen-lockfile ;;
          bun) bun install --frozen-lockfile ;;
          *) npm ci ;;
        esac

    - name: "Lint"
      id: lint
      continue-on-error: ${{ inputs.lint-continue-on-error == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        CMD="${{ inputs.lint-command }}"
        if [ -z "$CMD" ]; then
          case "${{ steps.detect.outputs.pm }}" in
            pnpm) CMD="pnpm lint" ;;
            yarn) CMD="yarn lint" ;;
            bun) CMD="bun run lint" ;;
            *) CMD="npx eslint ." ;;
          esac
        fi
        eval "$CMD" 2>&1 | tee .lint-output.txt
        echo "exit_code=$?" >> $GITHUB_OUTPUT

    - name: "TypeCheck"
      id: typecheck
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        CMD="${{ inputs.typecheck-command }}"
        if [ -z "$CMD" ]; then
          if [ -f "tsconfig.json" ]; then
            case "${{ steps.detect.outputs.pm }}" in
              pnpm) CMD="pnpm typecheck || pnpm exec tsc --noEmit" ;;
              yarn) CMD="yarn typecheck || yarn tsc --noEmit" ;;
              bun) CMD="bun run typecheck || bun x tsc --noEmit" ;;
              *) CMD="npx tsc --noEmit" ;;
            esac
          else
            echo "No tsconfig.json — skipping typecheck"
            echo "exit_code=0" >> $GITHUB_OUTPUT
            exit 0
          fi
        fi
        eval "$CMD" 2>&1 | tee .typecheck-output.txt
        echo "exit_code=$?" >> $GITHUB_OUTPUT

    - name: "Test"
      id: test
      continue-on-error: ${{ inputs.test-continue-on-error == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        CMD="${{ inputs.test-command }}"
        if [ -z "$CMD" ]; then
          case "${{ steps.detect.outputs.pm }}" in
            pnpm) CMD="pnpm test" ;;
            yarn) CMD="yarn test" ;;
            bun) CMD="bun test" ;;
            *) CMD="npm test" ;;
          esac
        fi
        eval "$CMD" 2>&1 | tee .test-output.txt
        echo "exit_code=$?" >> $GITHUB_OUTPUT

    - name: "Generate Agent Envelope"
      id: envelope
      shell: bash
      env:
        LINT_EXIT: ${{ steps.lint.outputs.exit_code }}
        TC_EXIT: ${{ steps.typecheck.outputs.exit_code }}
        TEST_EXIT: ${{ steps.test.outputs.exit_code }}
      run: |
        ${{ github.action_path }}/write-envelope.sh
