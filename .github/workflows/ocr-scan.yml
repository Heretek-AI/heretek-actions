name: "OCR Full Codebase Scan"
on:
  workflow_dispatch:
    inputs:
      scan-path:
        description: "Path to scan (default: entire repository)"
        type: string
        default: "."
        required: false
      ocr-llm-model:
        description: "LLM model override"
        type: string
        required: false
        default: ""
  workflow_call:
    secrets:
      ocr_llm_url:
        description: "LLM API endpoint URL (e.g. https://api.anthropic.com/v1/messages)"
        required: true
      ocr_llm_token:
        description: "LLM API authentication token"
        required: true
      repo_token:
        description: "GitHub token (defaults to GITHUB_TOKEN)"
        required: false
      ocr_llm_model:
        description: "LLM model name (e.g. claude-sonnet-4-20250514). Falls back to input ocr-llm-model, then vars.OCR_LLM_MODEL, then default."
        required: false
    inputs:
      scan-path:
        description: "Path to scan (default: entire repository)"
        type: string
        required: false
        default: "."
      ocr-llm-model:
        description: "LLM model override"
        type: string
        required: false
        default: ""
      ocr-use-anthropic:
        description: "Set to true for Anthropic protocol, false for OpenAI"
        type: string
        required: false
        default: "true"

permissions:
  contents: read
  issues: write

jobs:
  ocr-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - name: "Install and Configure OCR"
        id: setup
        shell: bash
        env:
          OCR_LLM_URL: ${{ secrets.ocr_llm_url }}
          OCR_LLM_TOKEN: ${{ secrets.ocr_llm_token }}
          OCR_LLM_MODEL: ${{ secrets.ocr_llm_model || inputs.ocr-llm-model || vars.OCR_LLM_MODEL || 'claude-sonnet-4-20250514' }}
          OCR_USE_ANTHROPIC: ${{ inputs.ocr-use-anthropic || vars.OCR_LLM_USE_ANTHROPIC || 'true' }}
        run: |
          # Install OCR CLI globally (puts ocr on PATH)
          npm install -g @alibaba-group/open-code-review

          echo "✅ ocr installed: $(ocr --version 2>&1 || true)"

          # Verify scan subcommand exists
          if ! ocr scan --help >/dev/null 2>&1; then
            echo "❌ 'ocr scan' subcommand not found"
            exit 1
          fi

          # Configure LLM from workflow secrets using official CI pattern
          # See: https://github.com/alibaba/open-code-review/blob/main/pages/src/content/docs/en/integrations/ci.md
          ocr config set llm.url "${OCR_LLM_URL}"
          ocr config set llm.auth_token "${OCR_LLM_TOKEN}"
          ocr config set llm.model "${OCR_LLM_MODEL}"
          ocr config set llm.use_anthropic "${OCR_USE_ANTHROPIC}"
          ocr config set llm.extra_body '{"thinking": {"type": "disabled"}}'

          # Test LLM connectivity
          echo "🔌 Testing LLM connection..."
          ocr llm test

      - name: "Run OCR Scan"
        id: scan
        shell: bash
        env:
          SCAN_PATH: ${{ inputs.scan-path || github.event.inputs.scan-path || '.' }}
        run: |
          mkdir -p .ocr

          echo "🔍 Scanning: ${SCAN_PATH}"

          # Run full repo scan — JSON output goes to stdout with --audience agent
          # Model is already configured via ocr config set in setup step
          ocr scan \
            --path "${SCAN_PATH}" \
            --format json \
            --audience agent \
            > .ocr/result.json 2>.ocr/scan-stderr.txt

          # Show stderr (if any) for debugging
          if [ -s .ocr/scan-stderr.txt ]; then
            cat .ocr/scan-stderr.txt >&2
          fi

          if [ -s .ocr/result.json ]; then
            echo "✅ OCR results saved to .ocr/result.json"
          else
            echo "⚠️ No JSON output from OCR scan — scan produced no results or failed"
            rm -f .ocr/result.json
          fi

      - name: "Build Agent Envelope"
        uses: ./.github/actions/ocr-envelope
        with:
          ocr-command: scan
          ocr-result-file: .ocr/result.json
          github-token: ${{ secrets.repo_token || secrets.GITHUB_TOKEN }}

      - name: "Upload Agent Output"
        uses: actions/upload-artifact@v4
        with:
          name: agent-output-ocr-scan
          path: |
            .agent/output.json
            .ocr/
          if-no-files-found: warn
          retention-days: 30

      - name: "Create Issues from Findings (opt-in)"
        if: false  # Disabled by default — enable by changing to 'if: true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.repo_token || secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .agent/output.json ]; then
            FINDINGS=$(jq -c '.findings[] | select(.severity == "error")' .agent/output.json)
            echo "$FINDINGS" | while IFS= read -r finding; do
              FILE=$(echo "$finding" | jq -r '.file // "unknown"')
              MESSAGE=$(echo "$finding" | jq -r '.message // ""')
              RULE=$(echo "$finding" | jq -r '.rule // "ocr-finding"')
              TITLE="[OCR] ${RULE}: ${MESSAGE:0:80}"
              BODY="**File:** \`${FILE}\`\n\n**Finding:** ${MESSAGE}\n\n_Generated by Open Code Review full scan_"

              gh issue create \
                --title "$TITLE" \
                --body "$BODY" \
                --label "ocr,automated" \
                2>/dev/null || true
            done
          fi

      - name: "Summarize"
        shell: bash
        run: |
          if [ -f .agent/output.json ]; then
            echo "## OCR Full Scan Results" >> $GITHUB_STEP_SUMMARY
            jq -r '. | "- **Status**: \(.status)\n- **Summary**: \(.summary)"' .agent/output.json >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            FINDINGS_COUNT=$(jq '.findings | length' .agent/output.json 2>/dev/null || echo 0)
            echo "**Total findings: ${FINDINGS_COUNT}**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "$FINDINGS_COUNT" -gt 0 ] && [ "$FINDINGS_COUNT" -le 30 ]; then
              echo "| Severity | Rule | File |" >> $GITHUB_STEP_SUMMARY
              echo "|----------|------|------|" >> $GITHUB_STEP_SUMMARY
              jq -r '.findings[] | "| \(.severity) | \(.rule) | `\(.file)` |"' .agent/output.json >> $GITHUB_STEP_SUMMARY
            fi
          fi
