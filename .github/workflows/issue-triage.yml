name: "Issue Triage"
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Triage Issue"
        uses: Heretek-AI/heretek-actions/.github/actions/issue-triage@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Read Agent Output"
        shell: bash
        run: |
          if [ -f .agent/output.json ]; then
            echo "### Issue Triage" >> $GITHUB_STEP_SUMMARY
            cat .agent/output.json | jq -r '. | "\(.summary)"' >> $GITHUB_STEP_SUMMARY
          fi
