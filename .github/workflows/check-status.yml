name: "Check Status"
on:
  workflow_call:
    inputs:
      wait-for-completion:
        description: "Max seconds to wait for all checks to complete"
        type: string
        default: "600"
        required: false
      poll-interval:
        description: "Seconds between polls"
        type: string
        default: "15"
        required: false
    secrets:
      repo_token:
        description: "GitHub token (defaults to GITHUB_TOKEN)"
        required: false

permissions:
  contents: read
  checks: read
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Watch Check Status"
        uses: ./.github/actions/check-status
        with:
          github-token: ${{ secrets.repo_token || secrets.GITHUB_TOKEN }}
          wait-for-completion: ${{ inputs.wait-for-completion }}
          poll-interval: ${{ inputs.poll-interval }}

      - name: "Read Agent Output"
        shell: bash
        run: |
          if [ -f .agent/output.json ]; then
            STATUS=$(jq -r '.status')
            SUMMARY=$(jq -r '.summary')
            echo "## Check Status: ${STATUS}" >> $GITHUB_STEP_SUMMARY
            echo "${SUMMARY}" >> $GITHUB_STEP_SUMMARY

            # Output merged status
            echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
            echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"
          fi
