name: "Pre-commit CI"
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  checks: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .pre-commit-config.yaml

      - name: "Install pre-commit"
        run: |
          pip install pre-commit
          pre-commit install-hooks

      - name: "Run pre-commit"
        id: precommit
        continue-on-error: true
        run: |
          pre-commit run --all-files --show-diff-on-failure 2>&1 | tee .agent/pre-commit-output.txt

      - name: "Generate Agent Envelope"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .agent

          # Parse pre-commit output
          ERROR_COUNT=$(grep -c '^[A-Z]' .agent/pre-commit-output.txt 2>/dev/null || echo 0)
          FAILED_COUNT=$(grep -c 'Failed' .agent/pre-commit-output.txt 2>/dev/null || echo 0)
          PASSED_COUNT=$(grep -c 'Passed' .agent/pre-commit-output.txt 2>/dev/null || echo 0)

          if [ "$FAILED_COUNT" -gt 0 ]; then
            STATUS="failure"
            SUMMARY="${FAILED_COUNT} hook(s) failed, ${PASSED_COUNT} passed"
          else
            STATUS="success"
            SUMMARY="${PASSED_COUNT} hook(s) passed"
          fi

          AGENT_OUTPUTS=$(cat <<OUTPUTS
          {
            "hooks_run": ${PASSED_COUNT},
            "hooks_failed": ${FAILED_COUNT},
            "hooks_errors": ${ERROR_COUNT}
          }
          OUTPUTS
          )
          export AGENT_OUTPUTS

          source .github/actions/agent-envelope.sh
          write_envelope "pre-commit" "$STATUS" "$SUMMARY"

      - name: "Upload Agent Output"
        uses: actions/upload-artifact@v4
        with:
          name: agent-output
          path: .agent/output.json
          if-no-files-found: warn
          retention-days: 7

      - name: "Summarize"
        shell: bash
        run: |
          if [ -f .agent/output.json ]; then
            echo "## Pre-commit Results" >> $GITHUB_STEP_SUMMARY
            cat .agent/output.json | jq -r '. | "\(.summary)"' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat .agent/pre-commit-output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: "Fail if hooks failed"
        if: steps.precommit.outcome == 'failure'
        run: exit 1
